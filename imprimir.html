<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imprimir etiqueta</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  @page { size: 50mm 25mm; margin: 0; }
  html,body{margin:0;padding:0;background:#fff;color:#111;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
  .label{width:50mm;height:25mm;display:block;page-break-after:always;break-after:page}
  .label:last-child{page-break-after:auto;break-after:auto}
  .label canvas{width:50mm;height:25mm;display:block}
  .ui{padding:16px;font-size:14px;max-width:560px}
  .ui h1{font-size:18px;margin:0 0 6px}
  .ui p{margin:6px 0;color:#444;line-height:1.45}
  .ui button{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:0;background:#ee6a1f;color:#fff;cursor:pointer}
  .ui .prev{display:inline-block;border:1px solid #ddd;border-radius:6px;padding:4px;margin:10px 0;background:#fff}
  .ui .prev canvas{width:300px;height:150px;display:block}
  code{background:#f2f2f2;padding:1px 5px;border-radius:4px}
  @media print { .ui{display:none} }
  /* Opcional (casilla "Girar"): si el diálogo toma la hoja de 50×25 como vertical (25 mm de ancho × 50 de alto), la etiqueta se gira para llenarla. Apagado por omisión: en el Mac con Safari la vista previa sale desplazada pero imprime bien. */
  @media print and (max-width: 40mm) {
    html.girar .label{width:25mm;height:50mm;overflow:hidden}
    html.girar .label canvas{transform-origin:0 0;transform:rotate(90deg) translateY(-25mm)}
  }
  @media screen { .sheet{display:none} }
</style>
</head>
<body>
<div class="ui" id="ui">
  <h1>Etiqueta 50 × 25 mm</h1>
  <p id="info"></p>
  <div class="prev" id="prev"></div>
  <p><button id="btn">Imprimir</button> <span id="msg" style="color:#666"></span></p>
  <p style="font-size:12.5px">En el diálogo elige el preset <b>etiquetas · 50 por 25 mm</b> con escala 100 %. El sistema recuerda la última configuración, así que después solo es Imprimir → Imprimir. Si la vista previa muestra la hoja vertical pero imprime bien, déjalo así.</p>
  <p style="font-size:12.5px"><label><input type="checkbox" id="girar"> Girar la etiqueta si la hoja sale vertical (solo si imprime desplazada; se recuerda en este equipo)</label></p>
</div>
<div class="sheet" id="sheet"></div>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const code=(q.get('c')||'').trim(), title=q.get('t')||'', sub=q.get('s')||'', lines=q.get('l')||'', kind=q.get('k')||'', copies=Math.max(1,Math.min(50,+q.get('n')||1));
  if(!code){ document.getElementById('info').textContent='Falta el código de la etiqueta. Abre esta página desde el botón Imprimir del inventario.'; document.getElementById('btn').disabled=true; return; }
  function qrCanvas(text,px){ const qr=qrcode(0,'M'); qr.addData(text); qr.make(); const n=qr.getModuleCount(); const c=document.createElement('canvas'); c.width=c.height=px; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,px,px); g.fillStyle='#000'; const cell=px/n; for(let r=0;r<n;r++)for(let col=0;col<n;col++) if(qr.isDark(r,col)) g.fillRect(Math.floor(col*cell),Math.floor(r*cell),Math.ceil(cell),Math.ceil(cell)); return c; }
  function wrap(g,text,maxW,maxLines){ const out=[]; let line=''; for(const w of String(text).split(/\s+/)){ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW&&line){ out.push(line); line=w; if(out.length===maxLines) return out; } else line=t; } if(line&&out.length<maxLines) out.push(line); if(out.length===maxLines&&g.measureText(out[maxLines-1]).width>maxW){ let l=out[maxLines-1]; while(g.measureText(l+'…').width>maxW&&l.length) l=l.slice(0,-1); out[maxLines-1]=l+'…'; } return out; }
  function render(scale){ // 50×25 mm; scale px/mm (8 = 203 dpi). Solo QR grande + texto negro; sin Code128.
    const W=50*scale,H=25*scale,u=scale/8, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    const qrSize=176*u; g.drawImage(qrCanvas(code,704),10*u,12*u,qrSize,qrSize);
    g.fillStyle='#000'; g.textBaseline='top'; const x=198*u, maxW=W-x-8*u; let y=10*u;
    g.font='800 '+(22*u)+'px system-ui, -apple-system, "Segoe UI", sans-serif'; for(const ln of wrap(g,title,maxW,2)){ g.fillText(ln,x,y); y+=25*u; }
    g.font='600 '+(15*u)+'px system-ui, -apple-system, "Segoe UI", sans-serif'; for(const ln of wrap(g,sub,maxW,2)){ g.fillText(ln,x,y); y+=18*u; }
    if(lines){ g.font='600 '+(13*u)+'px system-ui, -apple-system, "Segoe UI", sans-serif'; for(const ln of wrap(g,lines,maxW,3)){ g.fillText(ln,x,y); y+=15*u; } }
    g.font='800 '+(21*u)+'px ui-monospace, Menlo, Consolas, monospace'; g.fillText(code,x,H-32*u);
    return c;
  }
  document.getElementById('info').textContent=title+(sub?' · '+sub:'')+' · '+code+(copies>1?' · '+copies+' copias':'');
  document.getElementById('prev').appendChild(render(16));
  const sheet=document.getElementById('sheet'); for(let i=0;i<copies;i++){ const d=document.createElement('div'); d.className='label'; d.appendChild(render(16)); sheet.appendChild(d); }
  const go=()=>{ document.getElementById('msg').textContent='Abriendo el diálogo de impresión…'; try{ window.print(); }catch(e){ document.getElementById('msg').textContent='Tu navegador no permitió imprimir desde aquí: usa ⌘P / Ctrl+P.'; } };
  document.getElementById('btn').addEventListener('click',go);
  const gi=document.getElementById('girar'); try{ gi.checked=localStorage.getItem('etiq_girar')==='1'; }catch(e){} document.documentElement.classList.toggle('girar',gi.checked);
  gi.addEventListener('change',()=>{ document.documentElement.classList.toggle('girar',gi.checked); try{ localStorage.setItem('etiq_girar',gi.checked?'1':'0'); }catch(e){} });
  window.addEventListener('afterprint',()=>{ document.getElementById('msg').textContent='Enviado. Puedes cerrar esta pestaña.'; });
  if(q.get('auto')!=='0') setTimeout(go,350);
})();
</script>
</body>
</html>
